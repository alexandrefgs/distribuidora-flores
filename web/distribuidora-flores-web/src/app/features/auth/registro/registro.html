<div class="min-h-screen bg-gradient-to-br from-slate-950 via-purple-950 to-slate-900 flex items-center justify-center p-4 py-8">
  <div class="w-full max-w-md">

    <div class="text-center mb-6">
      <div class="text-5xl mb-2">🌸</div>
      <h1 class="text-3xl font-bold text-white">Distribuidora Flores</h1>
      <p class="text-slate-400 mt-1">Crie sua conta de comerciante</p>
    </div>

    <div class="bg-white/5 backdrop-blur-xl border border-white/10 rounded-2xl p-8 shadow-2xl">

      @if (sucesso()) {
        <div class="text-center py-6">
          <div class="text-5xl mb-4">✅</div>
          <p class="text-white font-medium">Cadastro realizado com sucesso!</p>
          <p class="text-slate-400 text-sm mt-1">Redirecionando para o login...</p>
        </div>
      } @else {
        <form (ngSubmit)="onSubmit()" class="space-y-4">

          <div>
            <label class="block text-sm font-medium text-slate-300 mb-1.5">Nome da floricultura</label>
            <input
              type="text"
              [(ngModel)]="nomeFantasia"
              name="nomeFantasia"
              required
              class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-lg text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-transparent transition"
              placeholder="Floricultura Bela Flor"
            />
          </div>

          <div>
            <label class="block text-sm font-medium text-slate-300 mb-1.5">CPF ou CNPJ</label>
            <input
              type="text"
              [(ngModel)]="documento"
              name="documento"
              required
              class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-lg text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-transparent transition"
              placeholder="000.000.000-00"
            />
          </div>

          <div>
            <label class="block text-sm font-medium text-slate-300 mb-1.5">Telefone</label>
            <input
              type="tel"
              [(ngModel)]="telefone"
              name="telefone"
              required
              class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-lg text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-transparent transition"
              placeholder="(47) 99999-9999"
            />
          </div>

          <div>
            <label class="block text-sm font-medium text-slate-300 mb-1.5">Endereço</label>
            <input
              type="text"
              [(ngModel)]="endereco"
              name="endereco"
              required
              class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-lg text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-transparent transition"
              placeholder="Rua das Flores, 123"
            />
          </div>

          <div>
            <label class="block text-sm font-medium text-slate-300 mb-1.5">Email</label>
            <input
              type="email"
              [(ngModel)]="email"
              name="email"
              required
              class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-lg text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-transparent transition"
              placeholder="seu@email.com"
            />
          </div>

          <div>
            <label class="block text-sm font-medium text-slate-300 mb-1.5">Senha</label>
            <input
              type="password"
              [(ngModel)]="senha"
              name="senha"
              required
              minlength="6"
              class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-lg text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-transparent transition"
              placeholder="••••••••"
            />
          </div>

          @if (erro()) {
            <div class="bg-red-500/10 border border-red-500/30 text-red-400 text-sm px-4 py-2.5 rounded-lg">
              {{ erro() }}
            </div>
          }

          <button
            type="submit"
            [disabled]="carregando()"
            class="w-full bg-gradient-to-r from-purple-600 to-pink-600 hover:from-purple-500 hover:to-pink-500 text-white font-semibold py-2.5 rounded-lg transition disabled:opacity-50 disabled:cursor-not-allowed"
          >
            @if (carregando()) {
              Cadastrando...
            } @else {
              Criar conta
            }
          </button>

          <p class="text-center text-sm text-slate-400">
            Já tem uma conta?
            <a routerLink="/login" class="text-purple-400 hover:text-purple-300 font-medium">Entrar</a>
          </p>
        </form>
      }
    </div>
  </div>
</div>
